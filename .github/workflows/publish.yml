name: publish
# A tag `v0.2.0-preview.3` publishes that version to npm (NPM_TOKEN in the repository secrets).
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
        env:
          EXAMPLES: ${{ github.workspace }}/engine/test/fixtures
      - name: the tag is the version in package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # a prerelease version (…-preview.N) goes out under the `preview` tag, never as `latest`
      - run: npm publish --provenance --access public --tag $(node -p "require('./package.json').version.includes('-') ? 'preview' : 'latest'")
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
