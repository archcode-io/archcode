name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # the spec's conformance suite runs against every commit; without the checkout the test skips
      - uses: actions/checkout@v4
        with:
          repository: archcode-io/archcode-spec
          path: archcode-spec
      - run: npm ci
      - run: npm test
        env:
          # the reference architectures, not the parser's edge-case fixtures (an empty file has no aspect)
          EXAMPLES: ${{ github.workspace }}/archcode-spec/examples
          CONFORMANCE: ${{ github.workspace }}/archcode-spec/conformance
      - run: npm run fuzz
      - name: the package holds what it should
        run: npm pack --dry-run
  cli:
    runs-on: ubuntu-latest
    needs: engine
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../engine && npm run build --prefix ../engine
      # the CLI names the published engine, as its users get it; here the engine from this
      # commit is linked in its place, so a change to both is tested together
      - run: mkdir -p node_modules/@archcode-io && ln -sfn ../../../engine node_modules/@archcode-io/engine
      - run: npm test
      - name: nothing published points at a local path
        run: node -e "const d=require('./package.json').dependencies??{};const bad=Object.entries(d).filter(([,v])=>/^(file|link|workspace):/.test(v));if(bad.length){console.error('local dependencies:',bad);process.exit(1)}"
  grammar:
    runs-on: ubuntu-latest
    needs: engine
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../engine && npm run build --prefix ../engine
      - run: npm install
      - name: the grammar is what the engine's vocabulary says
        run: node build.mjs && git diff --exit-code -- syntaxes/
  dco:
    # every commit is signed off (Developer Certificate of Origin); no CLA
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          missing=$(git log --format='%h %s%n%b' origin/${{ github.base_ref }}..HEAD | awk 'BEGIN{RS="";} !/Signed-off-by:/ {print}')
          if [ -n "$missing" ]; then echo "commits without Signed-off-by:"; echo "$missing"; exit 1; fi
